name: Public sync

# Runs on every push to main: strips everything that must never reach the
# public template branch, then publishes the cleaned tree as an ORPHAN
# commit (no connection to main's history), and finally mirrors that same
# commit to a public GitHub repo.
# - bundles/ (all instance knowledge, including bundles/.default-bundle)
# - FRAMEWORK-SYNC.md (instance's real origin repo reference)
# - any <!-- private --> ... <!-- /private --> block in any tracked file
#   (marker convention documented in AGENTS.md, "Framework files vs.
#   bundle content" — use this for anything instance-specific that ends
#   up inline in a framework file, e.g. AGENTS.md, that must not leak)
#
# CRITICAL: the published commit's parent is always the *previous public
# branch tip* (itself always an orphan-rooted, already-cleaned snapshot)
# or nothing at all — never a commit from main's history. A plain
# `git push --force` of a normal commit built on top of main would leave
# the stripped content fully recoverable via `git log` on the parent
# commit, even though the working tree looks clean. Orphan-rooting the
# public history is what actually prevents that.
#
# A marker only counts as a marker when it sits ALONE on its own line
# (leading/trailing whitespace allowed). An inline mention inside a
# sentence — as in the prose of AGENTS.md that documents this very
# convention — is deliberately not a marker; without that rule the
# framework's own documentation of the feature trips the check.
#
# The sync aborts (exit 1) if it finds an unterminated marker
# (opens != closes in some file) rather than silently leaving the marker
# and the content it should have hidden in place — an unterminated
# marker is exactly the failure mode that would otherwise leak
# instance-specific content to the public branch.
#
# Tags: pushing a tag matching v* on main publishes a lightweight tag of
# the same name on the GitHub mirror, pointing at the cleaned snapshot
# commit. The tag object from main is never mirrored: it points into the
# private history, and pushing it would make that history fetchable.
#
# The tag is deliberately NOT pushed back into this repository. Branches
# and tags share one namespace here, so publishing it under the same name
# would overwrite this repo's own tag on main — the public tag lives on
# the mirror only.
#
# GitHub mirror setup (one-time, done manually — not by the agent):
# - Actions variable GH_MIRROR_REPO: target repo, e.g.
#   "github.com/<owner>/<repo>.git" (already set in this repo)
# - Actions secret GH_MIRROR_TOKEN: a GitHub Personal Access Token with
#   contents:write on that repo (add this yourself under
#   Settings -> Actions -> Secrets; the agent never handles token values)
# If either is unset, the mirror step is skipped — the public branch
# push still happens normally.
#
# NOTE: `runs-on` must match a label your Forgejo Actions runner actually
# registers (Settings -> Actions -> Runners). This instance's runners
# offer `docker` and `linux`; a label the runner does not have leaves the
# job queued as "waiting" forever.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  clean-and-publish:
    runs-on: docker
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip instance-specific content
        run: |
          set -e

          # Instance content that must never reach the public branch.
          # bundles/ is recreated empty afterwards: the public template
          # should still ship the directory (with only .gitkeep in it),
          # since README's structure tree and every workflow refer to it.
          rm -rf bundles
          mkdir -p bundles
          : > bundles/.gitkeep
          rm -f FRAMEWORK-SYNC.md

          # Fail loudly on any unterminated <!-- private --> marker
          # instead of silently leaving it (and the content it should
          # have hidden) in place.
          OPEN_RE='^[[:space:]]*<!-- private -->[[:space:]]*$'
          CLOSE_RE='^[[:space:]]*<!-- /private -->[[:space:]]*$'

          bad=0
          while IFS= read -r -d '' f; do
            opens=$(grep -c "$OPEN_RE" "$f" || true)
            closes=$(grep -c "$CLOSE_RE" "$f" || true)
            if [ "$opens" != "$closes" ]; then
              echo "ERROR: unterminated <!-- private --> block in $f (opens=$opens closes=$closes)" >&2
              bad=1
            fi
          done < <(find . -type f -name "*.md" -not -path "./.git/*" -print0)
          if [ "$bad" != "0" ]; then
            echo "Aborting public-sync: fix the unterminated marker(s) above first." >&2
            exit 1
          fi

          # Strip <!-- private --> ... <!-- /private --> blocks from every
          # tracked Markdown file
          find . -type f -name "*.md" -not -path "./.git/*" | while read -r f; do
            if grep -q "$OPEN_RE" "$f"; then
              perl -0pi -e 's/^[ \t]*<!-- private -->[ \t]*\n.*?^[ \t]*<!-- \/private -->[ \t]*\n//gms' "$f"
            fi
          done

      - name: Build orphan public commit
        id: commit
        run: |
          set -e
          git config user.name "public-sync-bot"
          git config user.email "public-sync-bot@local"

          git add -A
          TREE=$(git write-tree)

          # Parent is the previous public branch tip if one exists — never
          # anything from main. This keeps a readable history of
          # public-facing changes without ever linking back to a commit
          # that contained bundles/ or FRAMEWORK-SYNC.md.
          git fetch origin public 2>/dev/null || true
          if git rev-parse --verify origin/public >/dev/null 2>&1; then
            PARENT_SHA=$(git rev-parse origin/public)
            if [ "$(git rev-parse "$PARENT_SHA^{tree}")" = "$TREE" ]; then
              # Nothing changed in the published tree — reuse the existing
              # snapshot instead of stacking an empty commit on top. This
              # is the normal case when a tag is pushed on a commit whose
              # branch push already produced a snapshot.
              echo "Cleaned tree identical to current public tip; reusing $PARENT_SHA"
              COMMIT="$PARENT_SHA"
            else
              COMMIT=$(git commit-tree "$TREE" -p "$PARENT_SHA" -m "public-sync: clean snapshot from $(git rev-parse --short HEAD)")
            fi
          else
            COMMIT=$(git commit-tree "$TREE" -m "public-sync: clean snapshot from $(git rev-parse --short HEAD)")
          fi

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Push orphan commit to public branch
        run: |
          git push origin "${{ steps.commit.outputs.commit }}:refs/heads/public" --force

      - name: Mirror same commit to GitHub
        env:
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_MIRROR_REPO: ${{ vars.GH_MIRROR_REPO }}
        run: |
          set -e
          if [ -z "$GH_MIRROR_TOKEN" ] || [ -z "$GH_MIRROR_REPO" ]; then
            echo "GH_MIRROR_TOKEN or GH_MIRROR_REPO not set — skipping GitHub mirror push."
            exit 0
          fi
          REMOTE="https://x-access-token:${GH_MIRROR_TOKEN}@${GH_MIRROR_REPO}"
          git push "$REMOTE" "${{ steps.commit.outputs.commit }}:refs/heads/main" --force
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG="${GITHUB_REF#refs/tags/}"
              git push "$REMOTE" "${{ steps.commit.outputs.commit }}:refs/tags/$TAG" --force
              ;;
          esac
